
name: Build Vulkan Ray Query APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source and assets
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Generate Android project
        run: |
          python3 scripts/generate.py android

      - name: Build Release APK
        working-directory: build/android_gradle
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Vulkan-Ray-Query-Android
          path: build/android_gradle/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
      
      - name: Upload Vulkan assets and shaders
        uses: actions/upload-artifact@v6
        with:
          name: Vulkan-Samples-Data
          path: |
            assets/
            shaders/
          if-no-files-found: error
          retention-days: 7
          
          
